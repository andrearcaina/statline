[project]
name = "statline"
version = "0.1.0"
description = "NBA play-by-play data pipeline"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6",
    "pyspark>=4.3.0",
    "confluent-kafka>=2.10",
    "pyarrow>=18",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
